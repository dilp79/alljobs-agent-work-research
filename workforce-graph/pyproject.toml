[project]
name = "workforce-graph"
version = "0.1.0"
description = "Unified occupation-activity-skill-agent graph"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==1.5.1",
    "polars==1.38.1",
    "pyarrow==24.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic==2.13.4",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "editables==0.5",
    "hatchling==1.27.0",
    "mypy==1.17.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
wfg = "workforce_graph.cli:main"

[build-system]
requires = ["editables==0.5", "hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce_graph"]

[tool.hatch.build.targets.wheel.force-include]
"research" = "workforce_graph/evidence/research_assets"

[tool.hatch.build.targets.sdist]
exclude = ["data"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
